<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>

    <link rel="icon" href="data:," />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background-color: #f4f4f4;
        padding: 20px;
      }

      .container {
        max-width: 450px;
        margin: auto;
      }

      .contact-box {
        background: lavenderblush;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0px 0px 10px rgb(172, 99, 150);
        margin-bottom: 20px;
      }

      h2 {
        text-align: center;
        margin-bottom: 10px;
      }

      .sub-text {
        text-align: center;
        font-size: 14px;
        color: gray;
        margin-bottom: 20px;
      }

      input,
      textarea {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      textarea {
        resize: none;
        height: 100px;
      }

      button {
        width: 100%;
        padding: 12px;
        background: paleturquoise;
        color: black;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      button:hover {
        background: darkblue;
        color: white;
      }

      #result {
        text-align: center;
        margin-top: 15px;
      }

      .emergency-box {
        background: white;
        padding: 15px;
        border-radius: 10px;
        text-align: center;
        box-shadow: 0px 0px 8px rgb(180, 180, 180);
      }

      .emergency-box a {
        text-decoration: none;
        color: green;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- Contact Form -->
      <div class="contact-box">
        <h2>Contact Us</h2>
        <h3 class="sub-text">We are here to help you...</h3>

        <input type="text" id="firstname" placeholder="First Name" />
        <input type="text" id="lastname" placeholder="Last Name" />
        <input type="email" id="email" placeholder="Enter Email" />
        <textarea id="message" placeholder="Enter Message"></textarea>

        <button id="submitBtn">Send Message</button>

        <p id="result"></p>
      </div>

      <!-- Emergency Contact -->
      <div class="emergency-box">
        <h3>Emergency Contact</h3>
        <p>For urgent help, contact us on WhatsApp:</p>
        <p>
          <a href="https://wa.me/9800000000" target="_blank">
            WhatsApp: 9800000000
          </a>
        </p>
        <p>
          <a href="mailto:sadichha@gmail.com"> Email: sadichha@gmail.com </a>
        </p>
      </div>
    </div>

    <div class="contact-box">
      <h2>Messages from Database</h2>
      <div id="messages"></div>
    </div>

    <script type="module" src="contact.js"></script>
  </body>
</html>
